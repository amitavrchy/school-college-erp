name: Verify Campus One
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend run setup
      - run: node backend/setup/verify.mjs
      - run: docker compose --env-file backend/.env -f backend/compose.yaml up --build -d --wait
      - run: docker compose --env-file backend/.env -f backend/compose.yaml exec -T api npm run db:seed
      - run: cd frontend && npx playwright install --with-deps chrome
      - run: npm --prefix backend run test:integration
      - run: npm --prefix frontend run test:e2e
      - if: failure()
        run: docker compose --env-file backend/.env -f backend/compose.yaml logs --tail=150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
