name: school-college-erp
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_local}
      POSTGRES_DB: campus_one
    ports: ['127.0.0.1:55439:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campus -d campus_one']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:56439:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:-campus_local}@postgres:5432/campus_one?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_MODE: ${PAYMENT_MODE:-manual}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_SANDBOX: ${SSLCOMMERZ_SANDBOX:-true}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform@campusone.edu.bd}
      PLATFORM_SEED_PASSWORD: ${PLATFORM_SEED_PASSWORD:-}
      FEE_FINE_PER_DAY_MINOR: ${FEE_FINE_PER_DAY_MINOR:-1000}
      ADMISSION_OFFER_HOURS: ${ADMISSION_OFFER_HOURS:-48}
      SIBLING_DISCOUNT_BPS: ${SIBLING_DISCOUNT_BPS:-0}
      FEE_REMINDERS_ENABLED: ${FEE_REMINDERS_ENABLED:-false}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-}
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
      NODE_ENV: production
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
